<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>practice</title>
    <style>
      body {
        margin: 20px;
        height: 100vh;
      }
      button {
        position: relative;
        top: 0%;
        left: 90%;
        padding: 10px 20px;
      }
      .container {
        display: flex;
        flex-wrap: wrap;
        margin: 10px;
      }
      .box {
        width: calc(33.333% - 10px);
        height: 30vh;
        margin: 5px;
        box-sizing: border-box;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: brown;
        text-align: center;
        position: relative;
      }
      .commentBox {
        margin: 0%;
        box-sizing: border-box;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: brown;
        text-align: center;
      }
      .para {
        font-size: 13px;
        font-weight: 400;
        color: black;
      }
      .title {
        font-size: 20px;
        font-weight: 600;
        color: aliceblue;
      }
      .email {
        font-size: 10px;
        font-weight: 300;
        color: aliceblue;
      }
      .colorPicker {
        display: none;
      }
      .container1 {
        position: relative;
      }
      .cross {
        position: absolute;
        top: 10px;
        left: 10px;
        border: none;
        background-color: transparent;
        background-image: url("cross.png");
        background-size: contain;
        background-repeat: no-repeat;
      }
      .commentButton {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 10px;
      }
      input,
      label {
        margin: 0.4rem 0;
      }
      .viewButton {
        position: absolute;
        top: 10px;
        left: 65%;
        font-size: 10px;
      }
      label {
        display: block;
        font:
          1rem "Fira Sans",
          sans-serif;
      }
    </style>
  </head>
  <body>
    <button class="button">Add</button>
    <div class="container"></div>
    <div class="containerShowComments"></div>
    <div class="containerPosts"></div>
    <div class="containerComments"></div>
  </body>

  <script>
    let button = document.querySelector("button");
    button.addEventListener("click", function () {
      newPosts();
    });
    async function newComments(postID)
    {
      let containerComments = document.querySelector(".containerComments");
      containerComments.style.display = "";

      let newCommentContainer = document.createElement("div");
      newCommentContainer.classList.add("commentBox");

      let title = document.createElement("p");
      title.textContent = "Add New Comment";
      title.classList.add("title");
      newCommentContainer.appendChild(title);

      let name = document.createElement("input");
      name.type = "text";
      name.classList.add("input");
      let nameLabel = document.createElement("label");
      nameLabel.textContent = "Enter Name";
      nameLabel.classList.add(".label");
      newCommentContainer.appendChild(nameLabel);
      newCommentContainer.appendChild(name);

      let email = document.createElement("input");
      email.type = "text";
      email.classList.add("input");
      let emailLabel = document.createElement("label");
      emailLabel.textContent = "Enter Email";
      emailLabel.classList.add("label");
      newCommentContainer.appendChild(emailLabel);
      newCommentContainer.appendChild(email);

      let body = document.createElement("input");
      body.type = "text";
      body.classList.add("input");
      let bodyLabel = document.createElement("label");
      bodyLabel.textContent = "Enter body";
      bodyLabel.classList.add("label");
      newCommentContainer.appendChild(bodyLabel);
      newCommentContainer.appendChild(body);

      let submitButton = document.createElement("button");
      submitButton.textContent = "submit";
      submitButton.classList.add("button");
      newCommentContainer.appendChild(submitButton);

      containerComments.appendChild(newCommentContainer);
      submitButton.addEventListener("click", async function () {
        try {
          const response = await fetch(
            "https://jsonplaceholder.typicode.com/comments",
            {
              method: "POST",
              body: JSON.stringify({
                postId: postID,
                name: name.value,
                email: email.value,
                body: body.value,
              }),
              headers: {
                "Content-type": "application/json; charset=UTF-8",
              },
            },
          );
          if (!response.ok) {
            throw new Error("Network error");
          }
          else{
            containerComments.removeChild(newCommentContainer);
            renderPosts();
          }
        } catch (error) {
          alert("Failed to load new comments.");

          console.error(error);
        }
      });
    }
    async function newPosts() {
      let containerPosts = document.querySelector(".containerPosts");
      containerPosts.style.display = "";
      try {
        const response = await fetch(
          "https://jsonplaceholder.typicode.com/posts",
          {
            method: "POST",
            body: JSON.stringify({
              title: "foo",
              body: "bar",
              userId: 1,
            }),
            headers: {
              "Content-type": "application/json; charset=UTF-8",
            },
          },
        );
        if (!response.ok) {
          throw new Error("Network error");
        }
        const post = await response.json();
        let cont = document.createElement("div");
        cont.classList.add("box");

        let title = document.createElement("p");
        title.textContent = post.title;
        title.classList.add("title");

        let p = document.createElement("p");
        p.textContent = post.body;
        p.classList.add("para");
        console.log(post.body);

        cont.appendChild(title);
        cont.appendChild(p);

        containerPosts.appendChild(cont);
      } catch (error) {
        alert("Failed to load New Posts.");

        console.error(error);
      }
    }
    async function renderPosts() {
      let container = document.querySelector(".container");
      container.style.display = "";

      try {
        const response = await fetch(
          "https://jsonplaceholder.typicode.com/posts",
        );
        if (!response.ok) {
          throw new Error("Network error");
        }

        const posts = await response.json();

        posts.forEach((element, i) => {
          let cont = document.createElement("div");
          cont.classList.add("box");
          let postID = element.id;

          let button1 = document.createElement("button");
          button1.classList.add("commentButton");
          button1.textContent = "Add comments";
          button1.addEventListener("click", function () {
            container.style.display = "none";
            newComments(postID);
          });

          let title = document.createElement("p");
          title.textContent = element.title;
          title.classList.add("title");

          let p = document.createElement("p");
          p.textContent = element.body;
          p.classList.add("para");
          console.log(element.body);

          let button2 = document.createElement("button");
          button2.classList.add("viewButton");
          button2.textContent = "View comments";
          button2.addEventListener("click", function () {
            container.style.display = "none";
            renderComments(postID);
          });

          //   cont.addEventListener("click", function () {
          //     container.style.display = "none";
          //     renderComments(postID);
          //   });

          cont.appendChild(title);
          cont.appendChild(p);
          cont.appendChild(button1);
          cont.appendChild(button2);
          container.appendChild(cont);
        });
      } catch (error) {
        alert("Failed to load Posts.");

        console.error(error);
      }
    }
    async function renderComments(postID) {
      let containerShowComments = document.querySelector(
        ".containerShowComments",
      );
      containerShowComments.style.display = "";

      try {
        const response = await fetch(
          `https://jsonplaceholder.typicode.com/comments?postId=${postID}`,
        );
        if (!response.ok) {
          throw new Error("Network error");
        }
        const comment = await response.json();

        comment.forEach((element, i) => {
          let cont = document.createElement("div");
          cont.classList.add("commentBox");

          let name = document.createElement("p");
          name.textContent = element.name;
          name.classList.add("title");

          let email = document.createElement("p");
          email.textContent = element.email;
          email.classList.add("email");

          let p = document.createElement("p");
          p.textContent = element.body;
          p.classList.add("para");

          let del = document.createElement("button");
          del.classList.add("cross");
          del.addEventListener("click", function () {
            renderPosts();
            containerShowComments.style.display = "none";
          });

          cont.appendChild(name);
          cont.appendChild(email);
          cont.appendChild(p);
          containerShowComments.appendChild(del);
          containerShowComments.appendChild(cont);
        });
      } catch (error) {
        alert("Failed to load comments.");
        console.error(error);
      }
    }
    renderPosts();
  </script>
</html>
